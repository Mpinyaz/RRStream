syntax = "proto3";
package task;

option go_package = "rrproducer/producer/models;models";

service TaskService {
  rpc SubmitTask(TaskRequest) returns (Empty);
  rpc PublishResponse(TaskResponse) returns (Empty);
}

enum TaskType {
  UNKNOWN = 0;
  CREATE_ACCOUNT = 1;
  BATCH_ACCOUNTS = 2;
  LOOKUP_ACCOUNTS = 3;
  CREATE_TRANSFER = 4;
  BATCH_TRANSFERS = 5;
  LOOKUP_TRANSFERS = 6;
}

message Empty {}
message TaskRequest {
  // --- Metadata ---
  string id = 1;
  TaskType task_type = 2;
  int64 created_at = 3;
  optional uint32 priority = 4;
  optional int32 retry_count = 5;

  // --- Common TigerBeetle Fields (Optional) ---
  optional uint32 ledger = 10;
  optional uint32 code = 11;
  optional uint32 flags = 12;

  // --- Identifiers (Optional) ---
  optional UInt128 account_id = 20;
  optional UInt128 transfer_id = 21;
  optional UInt128 debit_account_id = 22;
  optional UInt128 credit_account_id = 23;
  optional UInt128 pending_id = 24;

  // --- Transactional Data (Optional) ---
  optional UInt128 amount = 30;
  optional uint64 timeout = 31;

  // --- User Data (Optional) ---
  optional UInt128 user_data_128 = 40;
  optional uint64 user_data_64 = 41;
  optional uint32 user_data_32 = 42;

  // --- Batching & Queries (Optional) ---
  repeated CreateAccountRequest account_batch = 50;
  repeated CreateTransferRequest transfer_batch = 51;
  repeated UInt128 lookup_ids = 52;
  optional uint32 limit = 53;
}

// --- Helper Types ---

message UInt128 {
  fixed64 low = 1;
  fixed64 high = 2;
}

// Still used within account_batch
message CreateAccountRequest {
  UInt128 id = 1;
  uint32 ledger = 2;
  uint32 code = 3;
  optional UInt128 user_data_128 = 4;
  optional uint64 user_data_64 = 5;
  optional uint32 user_data_32 = 6;
  optional uint32 flags = 7;
}

// Still used within transfer_batch
message CreateTransferRequest {
  UInt128 id = 1;
  UInt128 debit_account_id = 2;
  UInt128 credit_account_id = 3;
  UInt128 amount = 4;
  optional UInt128 pending_id = 5;
  optional uint32 ledger = 6;
  optional uint32 code = 7;
  optional uint32 flags = 8;
  optional uint64 timeout = 9;
}

// --- Responses & Results ---

message TaskResponse {
  string id = 1;
  string task_type = 2;
  bool success = 3;
  string message = 4;
  optional AccountResult account_result = 5;
  optional TransferResult transfer_result = 6;
}

message Account {
  UInt128 id = 1;
  UInt128 debits_pending = 2;
  UInt128 debits_posted = 3;
  UInt128 credits_pending = 4;
  UInt128 credits_posted = 5;
  uint32 ledger = 6;
  uint32 code = 7;
  uint32 flags = 8;
  uint64 timestamp = 9;
}

message AccountResult {
  repeated Account accounts = 1;
  int32 count = 2;
}

message Transfer {
  UInt128 id = 1;
  UInt128 debit_account_id = 2;
  UInt128 credit_account_id = 3;
  UInt128 amount = 4;
  uint32 ledger = 5;
  uint32 code = 6;
  uint32 flags = 7;
  uint64 timestamp = 8;
}

message TransferResult {
  repeated Transfer transfers = 1;
  int32 count = 2;
}
