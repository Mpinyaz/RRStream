syntax = "proto3";

package task;

option go_package = "rrproducer/producer/models;models";

service Task {
  rpc Send(TaskRequest) returns (TaskResponse);
}

message TaskRequest {
  string id = 1;
  string task_type = 2;
  string content_type =3;
  map<string, string> payload = 4;
  int64 created_at = 5;
  optional uint32 priority = 6;
  optional int32 retry_count = 7;
}

message TaskResponse {
  string id = 1;
  string task_type = 2;
  bool success = 3;
  string message = 4;
}
