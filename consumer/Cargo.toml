[package]
name = "rrconsumer"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
rabbitmq-stream-client = "*"
bytes = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "*"
serde_amqp = "*"
tracing = "*"
tracing-subscriber = "*"
anyhow = "*"
tokio = { version = "1.47.1", features = ['full'] }
uuid = { version = "1", features = ["serde", "v4"] }
dotenv = "0.15.0"
prost = "*"
tonic-prost = "*"
prost-types = "*"
tonic = "0.14.2"
tigerbeetle = "0.0.1"

[build-dependencies]
tonic-prost-build = "*"
